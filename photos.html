<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe5">

  <title>Հիշողություններ · Միքայել Ծատրյան</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Noto+Serif+Armenian:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/photos.css">
</head>
<body data-page="photos">

  <header data-nav-root></header>

  <main id="gallery" class="gallery">
    <header class="gallery__hero">
      <h1 class="gallery__title">
        <span data-lang="am">Հիշողություններ</span>
        <span class="lang-hidden" data-lang="ru">Воспоминания</span>
      </h1>
      <p class="gallery__subtitle">
        <span data-lang="am">Միքայել Ծատրյան · 1958–2025</span>
        <span class="lang-hidden" data-lang="ru">Микаел Цатрян · 1958–2025</span>
      </p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Media tabs">
      <button class="tabs__btn is-active" role="tab" data-tab="photos" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-5-7 7"/>
        </svg>
        <span data-lang="am">Լուսանկարներ</span>
        <span class="lang-hidden" data-lang="ru">Фото</span>
      </button>
      <button class="tabs__btn" role="tab" data-tab="videos" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="6" width="14" height="12" rx="2"/><path d="M17 10l4-2v8l-4-2z"/>
        </svg>
        <span data-lang="am">Տեսանյութեր</span>
        <span class="lang-hidden" data-lang="ru">Видео</span>
      </button>
    </nav>

    <div id="panel-photos" class="tabs__panel is-active" role="tabpanel"></div>
    <div id="panel-videos" class="tabs__panel"           role="tabpanel"></div>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/photos.js"></script>
</body>
</html>
